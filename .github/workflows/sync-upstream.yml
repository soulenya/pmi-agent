name: Sync from upstream

# For a company fork: fetch the upstream Little Gerry repository, merge its
# master into a branch here and open a pull request with the diff. Nothing
# lands on master until someone merges that PR. Conflicts are, by design,
# limited to brand/brand.json (which the fork owns) and the release docs.
#
# Set the UPSTREAM_REPO repository variable (Settings → Variables) to the
# upstream "owner/name"; a private upstream also needs UPSTREAM_TOKEN (a
# read-only PAT on the upstream) in secrets. PMI's own repository has no
# upstream, so this workflow does nothing there.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to sync (branch or tag)"
        default: master
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: vars.UPSTREAM_REPO != ''
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'master' }}"
          if [ -n "${UPSTREAM_TOKEN:-}" ]; then
            URL="https://x-access-token:${UPSTREAM_TOKEN}@github.com/${{ vars.UPSTREAM_REPO }}.git"
          else
            URL="https://github.com/${{ vars.UPSTREAM_REPO }}.git"
          fi
          git remote add upstream "$URL"
          # The fork tags its own releases (v$(cat VERSION) on its merge
          # commits), so upstream's tags of the same name point elsewhere.
          # Never import them into refs/tags: keep them in a private namespace.
          git fetch --no-tags upstream \
            "+refs/heads/*:refs/remotes/upstream/*" \
            "+refs/tags/*:refs/upstream-tags/*"
          SHA=""
          for CANDIDATE in "refs/remotes/upstream/$REF" "refs/upstream-tags/$REF"; do
            if SHA=$(git rev-parse --verify -q "${CANDIDATE}^{commit}"); then break; fi
            SHA=""
          done
          if [ -z "$SHA" ]; then
            echo "::error::Upstream ref '$REF' is neither a branch nor a tag of ${{ vars.UPSTREAM_REPO }}."
            exit 1
          fi
          echo "UPSTREAM_SHA=$SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF=$REF" >> "$GITHUB_ENV"

      - name: Merge into a sync branch
        id: merge
        run: |
          set -euo pipefail
          git config user.name "little-gerry-sync"
          git config user.email "sync@users.noreply.github.com"
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          if git merge --no-edit "$UPSTREAM_SHA"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            # Same policy as scripts/new-company/update-from-upstream.ps1: the
            # fork keeps its brand file, workflow files take upstream's version.
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                brand/brand.json) git checkout --ours -- "$f"; git add -- "$f" ;;
                .github/workflows/*) git checkout --theirs -- "$f"; git add -- "$f" ;;
              esac
            done
            LEFT=$(git diff --name-only --diff-filter=U)
            if [ -n "$LEFT" ]; then
              # Open the PR anyway, with the conflict markers committed, so the
              # reviewer sees exactly where; the PR cannot be merged until fixed.
              git add -A
              git -c core.editor=true commit -q -m "Merge upstream (UNRESOLVED CONFLICTS: $(echo $LEFT | tr '\n' ' '))"
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
              echo "conflict_files=$(echo $LEFT | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            else
              git -c core.editor=true commit -q --no-edit
              echo "conflicts=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/${{ github.ref_name }})" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push -u origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.merge.outputs.changed == 'true'
        run: |
          BODY="Merges upstream \`${UPSTREAM_REF}\` (\`${UPSTREAM_SHA}\`). Review the diff, then merge and tag a release (\`gh release create v\$(cat VERSION)\`)."
          if [ "${{ steps.merge.outputs.conflicts }}" = "true" ]; then
            BODY="$(printf '%s\n\n%s %s\n%s' "$BODY" "**Unresolved conflicts** (markers are committed in this branch):" "${{ steps.merge.outputs.conflict_files }}" "Check out the branch, resolve them, commit, push, then merge.")"
          fi
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Sync from upstream ${{ vars.UPSTREAM_REPO }}@${UPSTREAM_REF}" \
            --body "$BODY"

      - name: Report conflicts
        if: steps.merge.outputs.conflicts == 'true'
        run: |
          echo "::warning::Upstream merge has conflicts in: ${{ steps.merge.outputs.conflict_files }} - see the pull request."
