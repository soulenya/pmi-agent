name: Build macOS installer

# Builds the macOS .pkg on a GitHub-hosted Mac runner and attaches it to the
# release. Triggers automatically when publish-release.ps1 (run from Windows)
# creates a new GitHub Release, so every release ends up with BOTH the Windows
# .exe and the macOS .pkg without needing a MacBook in the loop.
#
# It can also be run manually (workflow_dispatch) to back-fill the .pkg onto an
# existing release — e.g. v2.1.9, which was published without a macOS asset.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the .pkg to (e.g. v2.1.9)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    # Secrets are mapped to env so steps can detect whether signing is configured.
    # If the cert secret is empty, the build falls back to an unsigned .pkg.
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo at the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Import Developer ID Installer certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/lg-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"

          # Create and unlock a throwaway keychain for this job.
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import the Developer ID Installer cert (.p12).
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow command-line tools (productbuild) to use the key without prompting.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null

          # Put our keychain first in the search list so the identity is found.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Derive the full identity name and expose it to the build step.
          IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Installer:[^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Could not find a 'Developer ID Installer' identity in the imported cert."
            exit 1
          fi
          echo "  Using identity: $IDENTITY"
          echo "DEVELOPER_ID_INSTALLER=$IDENTITY" >> "$GITHUB_ENV"
          echo "LG_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_NOTARY_APPLE_ID != ''
        run: |
          # Store the notary profile in the default credential store (not the
          # throwaway signing keychain) so it is found by `notarytool submit
          # --keychain-profile` with no --keychain flag — which is what older
          # tags' build-macos.sh use when this workflow back-fills their .pkg.
          xcrun notarytool store-credentials "littlegerry" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=littlegerry" >> "$GITHUB_ENV"

      - name: Build macOS .pkg
        # DEVELOPER_ID_INSTALLER / NOTARY_PROFILE are set above only when secrets
        # exist; build-macos.sh signs + notarizes when present, else builds unsigned.
        run: bash scripts/build-macos.sh

      - name: Upload .pkg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" installer/Output/LittleGerry.pkg --clobber
