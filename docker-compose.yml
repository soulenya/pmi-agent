version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pmi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmi
      POSTGRES_PASSWORD: pmi_dev_password
      POSTGRES_DB: pmi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmi -d pmi_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
