services:
  postgres:
    # pgvector 16 — pinned to the multi-arch (amd64 + arm64) index digest so
    # Windows and Apple Silicon Macs run the exact same image, natively.
    # This is the same digest the existing Windows installs already run.
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: pmi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmi
      POSTGRES_PASSWORD: pmi_dev_password
      POSTGRES_DB: pmi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmi -d pmi_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
