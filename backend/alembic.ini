# Alembic configuration for PMI Agent backend
# Migration scripts are stored in migrations/

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# URL is overridden at runtime by DATABASE_URL_SYNC env var in migrations/env.py
sqlalchemy.url = postgresql://pmi:pmi_dev_password@localhost:5432/pmi_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
