# Alembic configuration for PMI Agent backend
# Migration scripts are stored in migrations/

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Resolution order in migrations/env.py: DATABASE_URL_SYNC in the environment,
# then backend/.env (written by the installer for the brand's role/database),
# then this value (PMI's development default).
sqlalchemy.url = postgresql://pmi:pmi_dev_password@localhost:5432/pmi_dev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
