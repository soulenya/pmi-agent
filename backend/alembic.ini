# Alembic configuration for PMI Agent backend
# Migration scripts are stored in migrations/

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Synchronous DATABASE_URL for Alembic (asyncpg doesn't work with Alembic directly)
# Set via environment variable DATABASE_URL_SYNC or fall back to env file
sqlalchemy.url = %(DATABASE_URL_SYNC)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
